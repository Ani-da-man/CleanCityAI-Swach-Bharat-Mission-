services:
  - type: web
    name: swachh-bharat-urban-poc
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
    startCommand: node portal-host.cjs
    healthCheckPath: /
    envVars:
      # With no provider key, the app automatically runs its clearly labelled
      # synthetic-data demo so reviewers can complete the core journey.
      - key: DEMO_MODE
        value: "true"
