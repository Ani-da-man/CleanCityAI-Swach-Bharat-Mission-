<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#123b38"/>
      <stop offset="100%" style="stop-color:#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Leaf/Recycle symbol -->
  <g transform="translate(256,240)" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trash can body -->
    <rect x="-70" y="-40" width="140" height="160" rx="12" fill="none"/>
    <!-- Trash can lid -->
    <line x1="-90" y1="-40" x2="90" y2="-40"/>
    <line x1="-30" y1="-70" x2="30" y2="-70"/>
    <line x1="-30" y1="-70" x2="-30" y2="-40"/>
    <line x1="30" y1="-70" x2="30" y2="-40"/>
    <!-- Trash can lines -->
    <line x1="-25" y1="0" x2="-25" y2="80"/>
    <line x1="0" y1="0" x2="0" y2="80"/>
    <line x1="25" y1="0" x2="25" y2="80"/>
  </g>
  <!-- Sparkle/AI dot -->
  <circle cx="380" cy="130" r="18" fill="#f4b35e"/>
  <circle cx="400" cy="100" r="8" fill="#f4b35e" opacity="0.6"/>
  <!-- Text -->
  <text x="256" y="440" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="40" fill="white" letter-spacing="2">SWACHH BHARAT</text>
</svg>
